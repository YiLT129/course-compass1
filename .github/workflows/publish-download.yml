name: Publish Android download
on:
  push:
    branches: [main]
    paths:
      - 'release-assets/0.3.0/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-download-v0.3.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify signed download
        working-directory: release-assets/0.3.0
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish v0.3.0 download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk=release-assets/0.3.0/course-compass-0.3.0-android.apk
          sums=release-assets/0.3.0/SHA256SUMS.txt
          if gh release view v0.3.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release v0.3.0 already exists; keep existing published assets."
            exit 0
          fi
          gh release create v0.3.0 "$apk" "$sums" --repo "$GH_REPO" --target "$RELEASE_COMMIT" --title "课间 v0.3.0 · Android 预览版" --notes-file release-assets/0.3.0/NOTES.md --prerelease
